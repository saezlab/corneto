[project]
name = "corneto"
description = "CORNETO: A Unified Framework for Omics-Driven Network Inference"
authors = [
    { name = "Pablo Rodriguez-Mier", email = "pablo.rodriguez-mier@uni-heidelberg.de" },
    { name = "Martin Garrido-Rodriguez", email = "martin.garrido@embl.de"},
    { name = "Attila Gabor", email = "attila.gabor@uni-heidelberg.de"},
    { name = "Julio Saez-Rodriguez", email = "saez@ebi.ac.uk"},
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version", "classifiers"]
dependencies = [
    "cvxpy-base>=1.5.1",
    "numpy>=1.25",
    "scipy>=1.14.1"
]

[project.urls]
homepage = "https://github.com/saezlab/corneto/"
repository = "https://github.com/saezlab/corneto/"

[project.scripts]
release = "corneto.release:main"

[project.optional-dependencies]
plot = [
    "networkx>=3.2.1",
    "matplotlib>=3.5.2",
    "graphviz>=0.20.1",
]
annnet = [
    "annnet[polars]>=0.2.0,<0.3"
]
os = [
    "cvxpy>=1.5.1",
    "pyscipopt>=5.4.1",
    "highspy>=1.9.0",
    "networkx>=3.2.1",
    "matplotlib>=3.5.2",
    "graphviz>=0.20.1",
    "scipy>=1.14.1"
]
research = [
    "cvxpy>=1.5.1",
    "networkx>=3.2.1",
    "gurobipy",
    "pyscipopt>=5.4.1",
    "highspy>=1.9.0",
    "pcst-fast>=1.0.10",
    "matplotlib>=3.5.2",
    "graphviz>=0.20.1",
    "PICOS>=2.6.0",
    "cobra>=0.29.0",
    "pandas>=2.2.3",
    "scipy>=1.14.1"
]
ml = [
    "cvxpy>=1.5.1",
    "jax>=0.6.1",
    "keras>=3.8.0",
    "scikit-learn>=1.6.0",
    "pandas>=2.2.3",
    "scipy>=1.14.1"
]
docs = [
    "sphinx>=5.0",
    "myst-parser>=0.18.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinxcontrib-napoleon>=0.7",
    "sphinxcontrib-bibtex>=2.5.0",
    "sphinx-design>=0.4.1",
    "sphinx-favicon>=1.0.1",
    "myst-nb>=0.17.2",
    "sphinx-autodoc-typehints>=1.21.8",
    "sphinx-hoverxref>=1.3.0",
    "pydot>=3.0.4"
]

[tool.poetry]
packages = [
    { include = "corneto" },
]
exclude = ["**/tests", "**/docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
version = "0.0.0"

[tool.poetry.dependencies]
python = ">=3.11"
numpy = ">=1.25"
cvxpy-base = ">=1.5.1"
scipy = ">=1.14.1"

# Optional dependencies for backwards compatibility
cvxpy = {version = ">=1.5.1", optional = true}
pyscipopt = {version = ">=5.4.1", optional = true}
highspy = {version = ">=1.9.0", optional = true}
networkx = {version = ">=3.2.1", optional = true}
matplotlib = {version = ">=3.5.2", optional = true}
graphviz = {version = ">=0.20.1", optional = true}
gurobipy = {version = "*", optional = true}
pcst-fast = {version = ">=1.0.10", optional = true}
PICOS = {version = ">=2.6.0", optional = true}
cobra = {version = ">=0.29.0", optional = true}
pandas = {version = ">=2.2.3", optional = true}
jax = {version = ">=0.6.1", optional = true}
keras = {version = ">=3.8.0", optional = true}
scikit-learn = {version = ">=1.6.0", optional = true}
omnipath = {version = ">=1.0.10", optional = true}
decoupler = {version = "^1.9.2", optional = true}
annnet = {version = ">=0.2.0,<0.3", extras = ["polars"], optional = true}

[tool.poetry.group.dev.dependencies]
scipy = "^1.15.2"
pyscipopt = "^5.4.1"
graphviz = "^0.20.1"
cobra = "^0.29.0"
networkx = "^3.2.1"
ipython = "^8.7.0"
ipykernel = "^6.23.1"
PICOS = "^2.6.0"
matplotlib = "^3.5.2"
cvxpy-base = "^1.6.5"
highspy = ">=1.9.0"
pytest = "^8.1.1"
flake8 = "^7.0.0"
pre-commit = "^3.7.0"
pydocstyle = "^6.3.0"
keras = "^3.8.0"
scikit-learn = "^1.6.0"
pandas = "^2.2.3"
swiglpk = "^5.0.12"
pcst-fast = "^1.0.10"
jax = "^0.6.1"
omnipath = "^1.0.10"
decoupler = "^2.0.2"
papermill = "^2.6.0"
pyrefly = "0.60.0"
ruff = "0.15.17"
twine = "6.2.0"


[tool.poetry-dynamic-versioning]
enable           = true
vcs              = "git"
pattern          = "default"
style            = "pep440"
tagged-metadata  = false

[tool.ruff]
fix = true
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "D",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D301",
    "D205",
    "D214",
    "D415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = "1.9.1"
poetry-plugin-export = "1.10.0"

[build-system]
requires = ["poetry-core==2.4.1", "poetry-dynamic-versioning==1.9.1"]
build-backend = "poetry_dynamic_versioning.backend"
