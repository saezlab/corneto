# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit tests

on:
  pull_request:
    branches:
      - main

# A PR into the public trunk is the release gate.  Do not repeat this matrix
# for every temporary branch push, merge to main, or release tag.
concurrency:
  group: unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.4.1"
  POETRY_DYNAMIC_VERSIONING_VERSION: "1.9.1"

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true # for dynamic versioning
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      env:
        # enable version injection
        POETRY_DYNAMIC_VERSIONING_COMMANDS: install,build
      run: |
        pip install "poetry==${POETRY_VERSION}"
        poetry self add "poetry-dynamic-versioning[plugin]==${POETRY_DYNAMIC_VERSIONING_VERSION}"
        poetry install
    - name: Validate pinned wasm-graphviz checksum
      run: |
        poetry run python scripts/check_wasm_graphviz_checksum.py
    - name: Test with pytest
      run: |
        poetry run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: ts-graphviz/setup-graphviz@v2
    - name: Install release-gate dependencies
      run: |
        pip install "poetry==${POETRY_VERSION}"
        poetry self add "poetry-dynamic-versioning[plugin]==${POETRY_DYNAMIC_VERSIONING_VERSION}"
        poetry install --extras docs
    - name: Check metadata and style
      run: |
        poetry check
        poetry run ruff check corneto tests
        poetry run ruff format --check corneto tests
    - name: Build documentation with warnings as errors
      run: poetry run sphinx-build -W --keep-going -b html docs docs/_build/html

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install pinned build tools
      run: |
        pip install "poetry==${POETRY_VERSION}" "poetry-dynamic-versioning[plugin]==${POETRY_DYNAMIC_VERSIONING_VERSION}" "twine==6.2.0"
    - name: Build and inspect distributions
      run: |
        poetry build
        twine check dist/*
    - name: Smoke-test the clean wheel
      run: |
        python -m venv /tmp/corneto-wheel-smoke
        /tmp/corneto-wheel-smoke/bin/pip install dist/*.whl
        /tmp/corneto-wheel-smoke/bin/python -c 'import corneto; print(corneto.__version__)'
