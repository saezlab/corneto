name: Publish Python Package

env:
  POETRY_VERSION: "2.4.1"
  POETRY_DYNAMIC_VERSIONING_VERSION: "1.9.1"

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write     # Required for OIDC trusted publishing
  contents: write     # Required for creating releases
  pull-requests: read # Required for release notes generation

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the full repo (including tags)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install the same pinned Poetry toolchain used by the release gate
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.4.1'
          virtualenvs-create: true
          virtualenvs-in-project: true

      # 4. Cache Poetry & pip caches for faster installs
      - name: Cache Poetry and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          poetry self add "poetry-dynamic-versioning[plugin]==${POETRY_DYNAMIC_VERSIONING_VERSION}"
          poetry install --no-interaction --no-root

      # 6. Validate tag and determine if should publish
      - name: Validate tag for publishing
        id: validate_tag
        run: |
          set -e
          case "${GITHUB_REF}" in
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/}"
              echo "Valid release tag detected: ${version}"
              echo "should_publish=true" >> $GITHUB_OUTPUT
              echo "version=${version}" >> $GITHUB_OUTPUT
              echo "pypi_version=${version#v}" >> $GITHUB_OUTPUT
              # Mark alpha/beta/rc tags as GitHub pre-releases automatically.
              if [[ "${version}" =~ -(alpha|beta|rc)([.-].*)?$ ]]; then
                echo "is_prerelease=true" >> $GITHUB_OUTPUT
                echo "make_latest=false" >> $GITHUB_OUTPUT
              else
                echo "is_prerelease=false" >> $GITHUB_OUTPUT
                echo "make_latest=true" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "Not a v* tag: ${GITHUB_REF}, skipping publishing"
              echo "should_publish=false" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

      # 7. Build source & wheel (only if should publish)
      - name: Build package
        if: steps.validate_tag.outputs.should_publish == 'true'
        run: |
          poetry build
          poetry run twine check dist/*

      # 8. Create GitHub Release with automated notes
      - name: Create GitHub Release
        if: steps.validate_tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.validate_tag.outputs.version }}
          name: Release ${{ steps.validate_tag.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.validate_tag.outputs.is_prerelease }}
          make_latest: ${{ steps.validate_tag.outputs.make_latest }}
          files: |
            dist/*
          body: |
            ## 📦 Installation

            ```bash
            pip install corneto==${{ steps.validate_tag.outputs.pypi_version }}
            ```

            ## 📖 Documentation

            - [📚 Documentation](https://saezlab.github.io/corneto/stable/)
            - [🚀 Getting Started](https://saezlab.github.io/corneto/stable/install.html)
            - [📑 API Reference](https://saezlab.github.io/corneto/stable/api/)

            ---

      # 9. Publish via PyPI OIDC trusted publishing (only if should publish)
      - name: Publish to PyPI
        if: steps.validate_tag.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
