[workspace]
name = "multi_condition_carnival"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
anndata = "==0.11.4"
matplotlib = "==3.10.3"
seaborn = "==0.13.2"
dcor = "==0.6"
python-graphviz = "*"
graphviz = "*"
numpy = "*"
pandas = "==2.3.3"
ipykernel = "*"
papermill = "*"
nbclient = "*"
charset-normalizer = "*"
pip = "*"

[pypi-dependencies]
gurobipy = ">=12.0.0"
decoupler = "==2.1.4"
omnipath = "==1.0.12"
pydeseq2 = "==0.5.1"
cvxpy = "==1.9.1"
cvxpy-base = "==1.9.1"
corneto = "==1.0.0rc5"

[tasks]
run-notebook = "python -m papermill multi_condition_carnival.ipynb multi_condition_carnival.ipynb --cwd ."
